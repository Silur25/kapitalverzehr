<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kapitalverzehr Rieden – wird geladen</title>
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
  html,body{height:100%;margin:0}
  body{
    font-family:Arial,Helvetica,sans-serif; font-size:14px;
    background:#F1F4F6; color:#16242E;
    display:flex; align-items:center; justify-content:center;
  }
  .kasten{
    background:#fff; border:1px solid #D3DDE3; border-radius:3px;
    padding:26px 30px; max-width:520px;
    box-shadow:0 1px 2px rgba(19,32,41,.05), 0 3px 10px rgba(19,32,41,.04);
  }
  h1{font-size:17px; margin:0 0 10px; border-bottom:2px solid #1F4E79; padding-bottom:8px}
  p{margin:0 0 8px; line-height:1.5}
  a{color:#1F4E79}
  .klein{font-size:12px; color:#55707F}
</style>
</head>
<body>
<div class="kasten">
  <h1>Kapitalverzehr Rieden</h1>
  <p id="text">Die aktuelle Fassung wird geladen …</p>
  <p class="klein">Diese Seite hält den Browser davon ab, eine alte Fassung aus seinem
    Zwischenspeicher zu zeigen. Sie ruft das Programm mit einer jedes Mal anderen
    Kennung auf; der Browser muss es deshalb frisch vom NAS holen.</p>
  <p class="klein" id="ersatz"></p>
</div>
<script>
  // Die Kennung ist der Zeitpunkt des Aufrufs in Millisekunden. Sie ist bei
  // jedem Oeffnen eine andere, weshalb der Browser keinen Treffer in seinem
  // Zwischenspeicher findet und die Datei neu anfordert. Diese Seite selbst
  // darf zwischengespeichert werden: der Wert entsteht erst beim Ausfuehren.
  var ziel = "index.html?v=" + Date.now();
  document.getElementById("ersatz").innerHTML =
    'Falls nichts geschieht: <a href="' + ziel + '">hier weiter</a>.';
  // replace statt href: der Zurueck-Knopf springt damit nicht auf diese
  // Zwischenseite, sondern auf die Seite davor.
  location.replace(ziel);
</script>
</body>
</html>
